name: Build Xteink Hub APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack app
        run: mkdir src && tar xzf xteink-hub-app.tar.gz -C src
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build APK
        working-directory: src
        run: |
          mkdir -p ~/.android
          cp signing/debug.keystore ~/.android/debug.keystore
          gradle assembleDebug --stacktrace
      - name: Publish to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp src/app/build/outputs/apk/debug/app-debug.apk XteinkHub.apk
          gh release create "v1.0.${{ github.run_number }}" XteinkHub.apk --title "Xteink Hub 1.0.${{ github.run_number }}" --notes "Tap XteinkHub.apk to download and install."
